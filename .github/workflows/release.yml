name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::Tag '$tag' must start with 'v' (e.g. v1.2.3)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Preflight checks
        run: scripts/preflight.sh "${{ steps.tag.outputs.tag }}"

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # The script and CHANGELOG entry are committed before the tag on a
          # normal release, so this succeeds. If either is absent (e.g. running
          # against an old tag that predates the script), fall back to
          # auto-generated notes rather than failing the release.
          if [ ! -f scripts/extract_changelog.py ]; then
            echo "::warning::scripts/extract_changelog.py not present at this tag; using auto-generated notes."
            echo "generate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes="$(python scripts/extract_changelog.py "$VERSION")"
          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION; using auto-generated notes."
            echo "generate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "generate=false" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.notes }}
          GENERATE: ${{ steps.changelog.outputs.generate }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists."
            if [ "$GENERATE" = "true" ]; then
              echo "::notice::No changelog notes available; leaving existing release notes unchanged."
            else
              gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
            fi
          else
            if [ "$GENERATE" = "true" ]; then
              gh release create "$TAG" --title "$TAG" --generate-notes
            else
              gh release create "$TAG" --title "$TAG" --notes "$NOTES"
            fi
          fi

      - name: Homebrew tap reminder
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "::notice::GitHub Release ${TAG} published. Remember to update the Homebrew formula in springernature/homebrew-opensource per AGENTS.md (url + sha256, regenerate resources from uv.lock, ship any new runtime files)."
