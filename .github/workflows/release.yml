name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Compile check
        run: uv run python -m py_compile estimator.py pricing.py

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$proj" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag) does not match pyproject.toml version $proj"
            exit 1
          fi
          echo "Tag and pyproject version agree: $proj"

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(python scripts/extract_changelog.py "$version")"
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG.md section found for version $version"
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "${{ steps.changelog.outputs.notes }}"

      - name: Homebrew tap reminder
        run: |
          echo "::notice::GitHub Release ${GITHUB_REF_NAME} published. Remember to update the Homebrew formula in springernature/homebrew-opensource per AGENTS.md (url + sha256, regenerate resources from uv.lock, ship any new runtime files)."
