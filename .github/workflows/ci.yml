name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Preflight checks
        run: scripts/preflight.sh

  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require CHANGELOG update for code/doc changes
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files:"; echo "$changed"
          # Only enforce when user-facing files change.
          if echo "$changed" | grep -Eq '\.py$|^README\.md$'; then
            if ! echo "$changed" | grep -q '^CHANGELOG\.md$'; then
              echo "::error::This PR changes code/README but not CHANGELOG.md. Add an entry under [Unreleased] (see CONTRIBUTING.md)."
              exit 1
            fi
          fi
          echo "CHANGELOG check passed."
