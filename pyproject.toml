[project]
name = "opencode-copilot-credit-estimator"
version = "0.2.0"
description = "Terminal UI for monitoring GitHub Copilot AI credit consumption from opencode session logs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.8",
    "textual-plotext>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
