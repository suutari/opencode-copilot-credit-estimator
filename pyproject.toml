[project]
name = "opencode-copilot-credit-estimator"
version = "0.4.0"
description = "Terminal UI for monitoring GitHub Copilot AI credit consumption from opencode session logs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.8",
    "textual-plotext>=1.0.1",
]

[project.scripts]
occe = "estimator:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["estimator", "pricing"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
